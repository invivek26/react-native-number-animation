name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Label the dry-run artifact as stable or next
        required: true
        default: stable
        type: choice
        options:
          - stable
          - next
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Verify and build
        run: bun run check

      - name: Validate release tag
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION=$(bun -p "require('./package.json').version")
          if [[ "${RELEASE_TAG}" != "v${PACKAGE_VERSION}" ]]; then
            echo "Tag ${RELEASE_TAG} does not match package version ${PACKAGE_VERSION}."
            exit 1
          fi

      - name: Pack without publishing
        run: |
          PACKED_TARBALL=$(bun pm pack --ignore-scripts --destination "${RUNNER_TEMP}" --quiet | tail -n 1)
          echo "PACKED_TARBALL=${PACKED_TARBALL}" >> "${GITHUB_ENV}"

      - name: Upload dry-run package
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: react-native-number-animation-${{ inputs.channel }}-dry-run
          path: ${{ env.PACKED_TARBALL }}
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub release for tag
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          "${PACKED_TARBALL}"
          --repo "${GITHUB_REPOSITORY}"
          --title "${GITHUB_REF_NAME}"
          --generate-notes
