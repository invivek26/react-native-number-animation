name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  library:
    name: Check, types, tests, build, and codegen
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Check formatting and lint
        run: bun run format:check && bun run lint

      - name: Check types
        run: bun run typecheck

      - name: Run tests
        run: bun test

      - name: Build distributable files
        run: bun run build

      - name: Generate Android Fabric artifacts
        run: >-
          bun node_modules/react-native/scripts/generate-codegen-artifacts.js
          --path .
          --targetPlatform android
          --outputPath "${RUNNER_TEMP}/codegen"

      - name: Verify generated component bindings
        run: >-
          test -f
          "${RUNNER_TEMP}/codegen/android/app/build/generated/source/codegen/jni/react/renderer/components/NumberAnimationViewSpec/ComponentDescriptors.h"

  package-consumer:
    name: Packed tarball consumer
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Build and pack the exact publish artifact
        run: |
          bun run build
          PACKED_TARBALL=$(bun pm pack --ignore-scripts --destination "${RUNNER_TEMP}" --quiet | tail -n 1)
          echo "PACKED_TARBALL=${PACKED_TARBALL}" >> "${GITHUB_ENV}"

      - name: Inspect package contents
        run: |
          tar -tzf "${PACKED_TARBALL}" > "${RUNNER_TEMP}/package-files.txt"
          grep -qx 'package/package.json' "${RUNNER_TEMP}/package-files.txt"
          grep -qx 'package/lib/module/index.js' "${RUNNER_TEMP}/package-files.txt"
          grep -qx 'package/lib/typescript/src/index.d.ts' "${RUNNER_TEMP}/package-files.txt"
          grep -qx 'package/NumberAnimation.podspec' "${RUNNER_TEMP}/package-files.txt"
          if grep -Eq '(^|/)(node_modules|example|.*\.test\.)' "${RUNNER_TEMP}/package-files.txt"; then
            echo 'The package contains development-only files.' >&2
            exit 1
          fi

      - name: Install tarball in a clean consumer
        working-directory: ${{ runner.temp }}
        run: |
          mkdir package-consumer
          cd package-consumer
          bun init -y
          bun add --exact "${PACKED_TARBALL}" react@19.2.3 react-native@0.85.3
          test -f node_modules/react-native-number-animation/lib/module/index.js
          test -f node_modules/react-native-number-animation/lib/typescript/src/index.d.ts
          bun -e "const pkg = require('./node_modules/react-native-number-animation/package.json'); if (!pkg.exports?.['.'] || !pkg.codegenConfig) process.exit(1)"
          cat > index.ts <<'EOF'
          import {
            AnimatedNumber,
            type AnimatedNumberProps,
          } from 'react-native-number-animation';

          const props: AnimatedNumberProps = { value: 1_234 };
          void AnimatedNumber;
          void props;
          EOF
          bunx tsc --noEmit --skipLibCheck --module preserve --moduleResolution bundler --target esnext index.ts

  android:
    name: Expo 56 / Android 24+ / New Architecture
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_newArchEnabled: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Generate Expo Android project
        working-directory: example
        run: bunx expo prebuild --clean --no-install --platform android

      - name: Build Android debug app
        run: bun run --cwd example build:android

  ios:
    name: Expo 56 / iOS 17+ / New Architecture
    runs-on: macos-15
    env:
      RCT_NEW_ARCH_ENABLED: '1'
      RCT_REMOVE_LEGACY_ARCH: '1'
      RCT_USE_PREBUILT_RNCORE: '1'
      RCT_USE_RN_DEP: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods
            example/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('bun.lock', 'NumberAnimation.podspec', 'example/app.json') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Generate Expo iOS project
        working-directory: example
        run: bunx expo prebuild --clean --platform ios

      - name: Build iOS simulator app
        working-directory: example
        run: >-
          xcodebuild
          IPHONEOS_DEPLOYMENT_TARGET=17.0
          ONLY_ACTIVE_ARCH=YES
          -workspace ios/NumberAnimationExample.xcworkspace
          -UseNewBuildSystem=YES
          -scheme NumberAnimationExample
          -configuration Debug
          -sdk iphonesimulator
          -derivedDataPath ios/build
          -quiet

  ios-static-frameworks:
    name: iOS static frameworks
    runs-on: macos-15
    env:
      RCT_NEW_ARCH_ENABLED: '1'
      RCT_REMOVE_LEGACY_ARCH: '1'
      USE_FRAMEWORKS: static
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ~/.cocoapods
          key: ${{ runner.os }}-static-pods-${{ hashFiles('bun.lock', 'NumberAnimation.podspec', 'example/app.json') }}
          restore-keys: |
            ${{ runner.os }}-static-pods-

      - name: Generate Expo iOS project
        working-directory: example
        run: bunx expo prebuild --clean --no-install --platform ios

      - name: Install static-framework pods
        working-directory: example/ios
        run: pod install

      - name: Build iOS simulator app with static frameworks
        working-directory: example
        run: >-
          xcodebuild
          IPHONEOS_DEPLOYMENT_TARGET=17.0
          ONLY_ACTIVE_ARCH=YES
          -workspace ios/NumberAnimationExample.xcworkspace
          -UseNewBuildSystem=YES
          -scheme NumberAnimationExample
          -configuration Debug
          -sdk iphonesimulator
          -derivedDataPath ios/build
          -quiet

  web:
    name: Expo 56 web export
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Export web app
        run: bun run --cwd example build:web

      - name: Verify web output
        run: test -f example/dist/index.html
